<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store - SRICART</title><style>body{font-family:Arial;margin:0;background:#f6f6f6;padding-bottom:80px}header{background:#fff;padding:12px;position:sticky;top:0}.top{font-weight:900;font-size:22px;color:#0a6b2a}.tabs{display:flex;gap:8px;overflow:auto;padding:10px}.tabs button{border:none;padding:8px 15px;border-radius:20px;background:#eee;white-space:nowrap}.tabs button.on{background:#0a6b2a;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:10px}.card img{width:100%;height:110px;object-fit:cover;border-radius:10px;background:#e8f5e9}.add{background:#0a6b2a;color:#fff;border:none;width:100%;padding:8px;border-radius:8px;font-weight:bold;margin-top:5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ddd}.nav a{text-decoration:none;color:#666;text-align:center;font-size:12px}</style></head><body><header><div class="top">🛒 SRICART</div><small>Delivering to 📍 Khanapur</small><br><br><b>Store</b></header><div class="tabs"><button class="on" onclick="filterP('veg',this)">Vegetables</button><button onclick="filterP('bakery',this)">Bekary</button><button onclick="filterP('groc',this)">Groceries</button><button onclick="filterP('drinks',this)">Drinks</button></div><div style="margin:10px;background:#fff3cd;padding:12px;border-radius:12px">🎁 <b>FREE Surprise gift on orders above ₹699</b></div><div class="grid" id="grid"></div><div class="nav"><a href="test.html">🏠<br>Home</a><a href="categories.html">▦<br>Categories</a><a href="cart.html">🛒<br>Cart</a><a href="test.html">📍<br>Food & Local</a><a href="more.html">•••<br>More</a></div><script>let P=[{n:'Karivepaku (curry leaves)',p:26,s:22,c:'veg',u:'per bunch',img:'🌿'},{n:'Dosakaya (cucumber)',p:62,s:58,c:'veg',u:'per kg',img:'🥒'},{n:'Chikkudukaya',p:36,s:32,c:'veg',u:'per kg',img:'🫛'},{n:'Kakarakaya',p:27,s:24,c:'veg',u:'per kg',img:'🥒'},{n:'Alu (potato)',p:24,s:22,c:'veg',u:'per kg',img:'🥔'},{n:'Tomato',p:40,s:36,c:'veg',u:'per kg',img:'🍅'},{n:'Onion',p:70,s:66,c:'veg',u:'per kg',img:'🧅'},{n:'Bread',p:40,s:35,c:'bakery',u:'per pack',img:'🍞'}];function show(cat){let g=document.getElementById('grid');g.innerHTML='';P.filter(x=>x.c==cat).forEach(x=>{g.innerHTML+=`<div class="card"><div style="font-size:50px;text-align:center;background:#e8f5e9;border-radius:10px;padding:15px">${x.img}</div><b>${x.n}</b><br><small>New • 30 MINS • ${x.u}</small><br><small>SUBSCRIBER ₹${x.s} | NORMAL ₹${x.p}</small><button class="add" onclick="addCart('${x.n}',${x.s})">+ ADD</button></div>`})}function filterP(c,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(c)}function addCart(n,p){let cart=JSON.parse(localStorage.getItem('sri_cart')||'[]');cart.push({name:n,price:p});localStorage.setItem('sri_cart',JSON.stringify(cart));alert(n+' - Cart lo add ayindhi!')}show('veg');</script></body></html>
