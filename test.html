<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SRICART - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#EEF3EB;padding-bottom:78px;color:#12250F}
a{text-decoration:none;color:inherit}
.header{position:sticky;top:0;z-index:50;background:#fff;padding:10px 14px 10px;border-bottom:1px solid #E8E8E8}
.top-row{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.logo-badge{width:34px;height:34px;background:#0B6A2F;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;border:2px solid #FFD23F}
.logo b{font-size:20px;letter-spacing:.5px;color:#0B6A2F}
.icons{display:flex;gap:16px;font-size:19px;color:#222}
.deliver{font-size:12px;margin-top:6px;color:#555}
.deliver b{color:#0B6A2F;background:#E8F5E9;padding:3px 8px;border-radius:20px;font-size:12px}
.search{margin-top:10px;background:#F2F2F2;border-radius:22px;padding:11px 12px;display:flex;gap:8px;color:#777;font-size:14px}
.hero{margin:12px 14px 0;background:#0B4D1F;border-radius:18px;overflow:hidden;position:relative;min-height:210px;color:#fff;display:flex;transition:0.5s}
.hero-left{padding:20px 14px;width:58%;z-index:2}
.hero-left h1{font-size:32px;line-height:1.05;letter-spacing:-.5px;transition:0.3s}
.hero-left p{font-size:13px;margin:8px 0 14px;opacity:.9}
.hero-btn{background:#0F7A38;color:#fff;border:none;padding:10px 16px;border-radius:20px;font-weight:700;font-size:14px}
.hero-right{width:42%;position:relative}
.hero-right img{width:100%;height:100%;object-fit:cover;display:block}
.hero-dots{display:flex;gap:5px;margin:10px 0 0 14px}
.dot{width:18px;height:6px;background:#0B6A2F;border-radius:10px;transition:0.3s}
.dot.off{width:6px;background:#C8D6C8}
.card{background:#fff;border-radius:22px 22px 0 0;margin-top:12px;padding:16px 14px 10px}
.card h2{font-size:20px}
.card small{color:#777;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.box{border-radius:16px;padding:12px;min-height:132px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.box .arrow{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:12px}
.box .ic{font-size:20px;width:32px;height:32px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.box b{font-size:14px;line-height:1.1}
.box span{font-size:11px;color:#555;line-height:1.2}
.g1{background:linear-gradient(180deg,#0B6A2F,#1A8A4A);color:#fff}.g1 span{color:#EAF7EE}
.g2{background:#FFF1E6}.g3{background:#FFEDE8}.g4{background:#FFF6D6}.g5{background:#E8F7E6}.g6{background:#E6F2FF}.g7{background:#FFF0D9}.g8{background:#EAF6EC}.g9{background:#EFF3F0}
.banner{margin:14px;background:#0F7A38;color:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner b{font-size:15px}.banner p{font-size:12px;opacity:.9}
.banner button{background:#fff;border:none;padding:9px 14px;border-radius:20px;font-weight:800;color:#0B6A2F}
.bulk{margin:0 14px;background:#0B4D1F;color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden}
.bulk .tag{background:#FFD23F;color:#000;font-size:10px;font-weight:900;padding:5px 8px;border-radius:6px;letter-spacing:.5px}
.bulk h3{font-size:22px;line-height:1.1;margin:10px 0 6px}
.bulk p{font-size:12px;line-height:1.4;opacity:.9}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.pills span{background:rgba(255,255,255,.15);padding:6px 10px;border-radius:20px;font-size:12px}
.bulk-btn{background:#FFD23F;border:none;width:100%;padding:12px;border-radius:12px;text-align:left;font-weight:800;display:flex;justify-content:space-between;margin-top:6px}
.sec{padding:16px 14px 0}
.sec-head{display:flex;justify-content:space-between;align-items:center}
.sec-head h3{font-size:18px}.sec-head p{font-size:12px;color:#777}
.view{background:#DCEEDF;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#0B6A2F}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.prod{border-radius:14px;overflow:hidden;position:relative;height:150px}
.prod img{width:100%;height:100%;object-fit:cover}
.prod-info{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff}
.prod-info b{font-size:14px}.prod-info p{font-weight:800}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;scroll-behavior:smooth}
.hcard{min-width:150px;width:150px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #EDEDED;transition:0.3s}
.hcard img{width:100%;height:110px;object-fit:cover}
.hcard-body{padding:10px}
.hcard-body b{font-size:13px}.hcard-body small{color:#777;font-size:11px}
.price{font-weight:900;font-size:14px;margin-top:4px}
.member{background:#E8F7E6;color:#0B6A2F;font-size:10px;padding:3px 6px;border-radius:6px;display:inline-block;margin-top:4px;font-weight:700}
.made{background:#FFF3D6;color:#8A6A00;font-size:10px;padding:3px 6px;border-radius:6px;display:inline-block;margin-top:4px;font-weight:700}
.plus{position:absolute;top:8px;right:8px;width:26px;height:26px;background:#0B6A2F;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.rel{position:relative}
.order-btn{background:#0B6A2F;color:#fff;border:none;width:100%;padding:8px;border-radius:20px;margin-top:8px;font-weight:700;font-size:12px}
.plans{background:#0B6A2F;color:#fff;border-radius:18px;padding:16px;margin:14px}
.plans h3{font-size:18px}.plans p{font-size:12px;opacity:.9;margin:4px 0 12px}
.plan-row{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth}
.plan{min-width:140px;background:rgba(255,255,255,.12);border-radius:12px;padding:12px}
.plan b{font-size:13px}.plan span{font-size:12px}
.plans .white{background:#fff;color:#000;border:none;width:100%;padding:11px;border-radius:10px;font-weight:800;margin-top:12px}
.live{background:#E8F7E6;margin:0 14px;padding:10px 12px;border-radius:10px;font-size:12px;display:flex;justify-content:space-between}
.plan3{display:flex;gap:10px;margin-top:12px}
.plan3 div{flex:1;background:#fff;border-radius:14px;padding:14px;text-align:center}
.plan3 b{font-size:13px;display:block;margin-top:8px}.plan3 span{font-size:11px;color:#777}
.meal{margin:14px;border-radius:18px;overflow:hidden;position:relative;height:210px}
.meal img{width:100%;height:100%;object-fit:cover}
.meal-over{position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.meal-over h3{font-size:24px}.meal-over button{background:#0F7A38;color:#fff;border:none;padding:9px 14px;border-radius:20px;font-weight:700;width:130px;margin-top:10px}
.rev{display:flex;gap:10px;overflow-x:auto;padding-top:12px;scroll-behavior:smooth}
.rev div{min-width:190px;background:#fff;padding:14px;border-radius:14px}
.rev b{font-size:12px}
.join{margin:14px;background:#0B6A2F;color:#fff;border-radius:20px;padding:18px}
.join h3{font-size:24px;line-height:1.15}.join h3 span{color:#FFD23F}
.join p{font-size:13px;line-height:1.5;margin:10px 0}
